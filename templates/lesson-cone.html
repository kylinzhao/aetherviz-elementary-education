<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>认识圆锥体 - AetherViz 小学教学</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script><style>:root{--primary-gradient:linear-gradient(135deg,#F59E0B 0%,#EF4444 100%);--bg-gradient:linear-gradient(180deg,#0F172A 0%,#9A3412 50%,#991B1B 100%)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg-gradient);color:#F8FAFC;font-size:18px}#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}.navbar{position:fixed;top:0;left:0;right:0;height:70px;background:rgba(15,23,42,0.85);backdrop-filter:blur(10px);border-bottom:2px solid rgba(245,158,11,0.3);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}.navbar-title{font-size:32px;font-weight:bold;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.btn-kid{min-width:60px;min-height:60px;padding:16px 24px;font-size:18px;border-radius:12px;border:none;background:var(--primary-gradient);color:white;cursor:pointer}.control-panel{position:fixed;right:0;top:70px;width:30%;height:calc(100vh-70px);background:rgba(154,52,18,0.7);backdrop-filter:blur(10px);border-left:1px solid rgba(245,158,11,0.25);padding:24px;overflow-y:auto;z-index:90}.control-section{margin-bottom:24px;padding:16px;background:rgba(255,255,255,0.08);border-radius:12px}.control-label{font-size:20px;font-weight:600;margin-bottom:12px;display:block}input[type="range"].kid-slider{-webkit-appearance:none;width:100%;height:12px;border-radius:6px;background:rgba(255,255,255,0.2);cursor:pointer}input[type="range"].kid-slider::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--primary-gradient);cursor:pointer}</style></head><body><div id="canvas-container"></div><nav class="navbar"><div class="navbar-title">🔺 认识圆锥体</div><div style="display:flex;gap:12px"><button class="btn-kid" id="toggleControls">控制</button><button class="btn-kid" onclick="window.location.href='index.html'">返回</button></div></nav><div class="control-panel" id="controlPanel"><div class="control-section"><label class="control-label" for="radiusSlider">底面半径</label><input type="range" class="kid-slider" id="radiusSlider" min="1" max="5" value="3"><div style="text-align:center;margin-top:8px;font-size:24px" id="radiusValue">3</div></div><div class="control-section"><label class="control-label" for="heightSlider">高度</label><input type="range" class="kid-slider" id="heightSlider" min="1" max="10" value="6"><div style="text-align:center;margin-top:8px;font-size:24px" id="heightValue">6</div></div><div class="control-section" style="padding:16px;background:rgba(245,158,11,0.2);border-radius:12px"><div style="text-align:center">母线长度：<span id="slantHeight" style="color:#F59E0B;font-size:28px;font-weight:bold">6.7</span></div><div style="text-align:center;margin-top:12px">体积：<span id="volume" style="color:#EF4444;font-size:28px;font-weight:bold">56.5</span></div></div></div><script>let scene,camera,renderer,cone;let radius=3,height=6;function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);camera.position.set(8,5,10);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.getElementById('canvas-container').appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,0.6));const light=new THREE.DirectionalLight(0xffffff,0.8);light.position.set(10,10,10);scene.add(light);createCone();updateCalculations();animate()}function createCone(){if(cone)scene.remove(conone);cone=new THREE.Group();const geometry=new THREE.ConeGeometry(radius,height,32);const material=new THREE.MeshPhongMaterial({color:0xF59E0B,transparent:true,opacity:0.8});const mesh=new THREE.Mesh(geometry,material);const edges=new THREE.EdgesGeometry(geometry);const line=new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:0xffffff}));cone.add(mesh);cone.add(line);scene.add(cone)}function updateCalculations(){const slantHeight=Math.sqrt(radius*radius+height*height);const volume=Math.PI*radius*radius*height/3;document.getElementById('slantHeight').textContent=slantHeight.toFixed(1);document.getElementById('volume').textContent=volume.toFixed(1);document.getElementById('radiusValue').textContent=radius;document.getElementById('heightValue').textContent=height}function animate(){requestAnimationFrame(animate);if(cone)cone.rotation.y+=0.005;renderer.render(scene,camera)}document.addEventListener('DOMContentLoaded',function(){init();document.getElementById('toggleControls').addEventListener('click',function(){document.getElementById('controlPanel').classList.toggle('active')});document.getElementById('radiusSlider').addEventListener('input',function(){radius=parseFloat(this.value);createCone();updateCalculations()});document.getElementById('heightSlider').addEventListener('input',function(){height=parseFloat(this.value);createCone();updateCalculations()});});</script></body></html>
