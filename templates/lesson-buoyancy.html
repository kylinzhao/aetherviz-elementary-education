<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>浮力原理 - AetherViz 小学教学</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script><style>:root{--primary-gradient:linear-gradient(135deg,#22C55E 0%,#06B6D4 100%);--bg-gradient:linear-gradient(180deg,#0F172A 0%,#14532D 50%,#164E63 100%)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg-gradient);color:#F8FAFC;font-size:18px}#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}.navbar{position:fixed;top:0;left:0;right:0;height:70px;background:rgba(15,23,42,0.85);backdrop-filter:blur(10px);border-bottom:2px solid rgba(34,197,94,0.3);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}.navbar-title{font-size:32px;font-weight:bold;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.btn-kid{min-width:60px;min-height:60px;padding:16px 24px;font-size:18px;border-radius:12px;border:none;background:var(--primary-gradient);color:white;cursor:pointer}.control-panel{position:fixed;right:0;top:70px;width:30%;height:calc(100vh-70px);background:rgba(20,83,45,0.7);backdrop-filter:blur(10px);border-left:1px solid rgba(34,197,94,0.25);padding:24px;overflow-y:auto;z-index:90}.control-section{margin-bottom:24px;padding:16px;background:rgba(255,255,255,0.08);border-radius:12px}.control-label{font-size:20px;font-weight:600;margin-bottom:12px;display:block}</style></head><body><div id="canvas-container"></div><nav class="navbar"><div class="navbar-title">🌊 浮力原理</div><div style="display:flex;gap:12px"><button class="btn-kid" id="toggleControls">控制</button><button class="btn-kid" onclick="window.location.href='index.html'">返回</button></div></nav><div class="control-panel" id="controlPanel"><div class="control-section"><label class="control-label">🧪 选择物体</label><button class="btn-kid" id="btnWood">木块</button><button class="btn-kid" id="btnIron">铁块</button><button class="btn-kid" id="btnPlastic">塑料块</button></div><div class="control-section"><label class="control-label">💧 放入水中</label><button class="btn-kid" id="btnDrop">放入水中</button><button class="btn-kid" id="btnReset">重置</button></div><div class="control-section"><label class="control-label">📊 浮力计算</label><div style="padding:16px;background:rgba(34,197,94,0.2);border-radius:12px"><div>物体重力：<span id="gravity" style="color:#22C55E;font-size:24px">-</span></div><div style="margin-top:8px">浮力大小：<span id="buoyancy" style="color:#06B6D4;font-size:24px">-</span></div><div style="margin-top:8px">最终状态：<span id="status" style="color:#F59E0B;font-size:20px">-</span></div></div></div></div><script>let scene,camera,renderer,water,obj;let objType='wood';function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);camera.position.set(0,3,12);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.getElementById('canvas-container').appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,0.6));const light=new THREE.DirectionalLight(0xffffff,0.8);light.position.set(10,10,10);scene.add(light);createWater();createObject();animate()}function createWater(){const waterGeom=new THREE.BoxGeometry(10,4,6);const waterMat=new THREE.MeshPhongMaterial({color:0x06B6D4,transparent:true,opacity:0.6});water=new THREE.Mesh(waterGeom,waterMat);water.position.y=-2;scene.add(water)}function createObject(){if(obj)scene.remove(obj);obj=new THREE.Group();let mat,size,gravity;switch(objType){case'wood':mat=new THREE.MeshPhongMaterial({color:0x92400E});size=1.5;gravity=10;break;case'iron':mat=new THREE.MeshPhongMaterial({color:0x71717A});size=1.2;gravity=25;break;case'plastic':mat=new THREE.MeshPhongMaterial({color:0xF59E0B});size=1.3;gravity=8;break;}const mesh=new THREE.Mesh(new THREE.BoxGeometry(size,size,size),mat);obj.add(mesh);obj.userData={size,gravity,y:4};obj.position.y=4;scene.add(obj);document.getElementById('gravity').textContent=gravity+'N'}function dropObject(){const targetY=objType==='wood'?0.5:objType==='iron'?-3.8:0.8;const buoyancy=objType==='wood'?10:objType==='iron'?0:8;document.getElementById('buoyancy').textContent=buoyancy+'N';document.getElementById('status').textContent=objType==='wood'?'漂浮':objType==='iron'?'下沉':'漂浮';let currentY=obj.position.y;const drop=setInterval(()=>{if(currentY>targetY){currentY-=0.05;obj.position.y=currentY}else{clearInterval(drop)}},16)}function animate(){requestAnimationFrame(animate);if(water)water.position.y=-2+Math.sin(Date.now()*0.001)*0.1;renderer.render(scene,camera)}document.addEventListener('DOMContentLoaded',function(){init();document.getElementById('toggleControls').addEventListener('click',function(){document.getElementById('controlPanel').classList.toggle('active')});document.getElementById('btnWood').addEventListener('click',function(){objType='wood';createObject()});document.getElementById('btnIron').addEventListener('click',function(){objType='iron';createObject()});document.getElementById('btnPlastic').addEventListener('click',function(){objType='plastic';createObject()});document.getElementById('btnDrop').addEventListener('click',dropObject);document.getElementById('btnReset').addEventListener('click',function(){createObject();document.getElementById('buoyancy').textContent='-';document.getElementById('status').textContent='-'})});</script></body></html>
