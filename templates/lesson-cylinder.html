<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>认识圆柱体 - AetherViz 小学教学</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script><style>:root{--primary-gradient:linear-gradient(135deg,#22C55E 0%,#06B6D4 100%);--bg-gradient:linear-gradient(180deg,#0F172A 0%,#14532D 50%,#164E63 100%)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg-gradient);color:#F8FAFC;font-size:18px}#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}.navbar{position:fixed;top:0;left:0;right:0;height:70px;background:rgba(15,23,42,0.85);backdrop-filter:blur(10px);border-bottom:2px solid rgba(34,197,94,0.3);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}.navbar-title{font-size:32px;font-weight:bold;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.btn-kid{min-width:60px;min-height:60px;padding:16px 24px;font-size:18px;border-radius:12px;border:none;background:var(--primary-gradient);color:white;cursor:pointer}.control-panel{position:fixed;right:0;top:70px;width:30%;height:calc(100vh-70px);background:rgba(20,83,45,0.7);backdrop-filter:blur(10px);border-left:1px solid rgba(34,197,94,0.25);padding:24px;overflow-y:auto;z-index:90}.control-section{margin-bottom:24px;padding:16px;background:rgba(255,255,255,0.08);border-radius:12px}.control-label{font-size:20px;font-weight:600;margin-bottom:12px;display:block}input[type="range"].kid-slider{-webkit-appearance:none;width:100%;height:12px;border-radius:6px;background:rgba(255,255,255,0.2);cursor:pointer}input[type="range"].kid-slider::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--primary-gradient);cursor:pointer}.info-display{padding:16px;background:rgba(34,197,94,0.2);border-radius:12px;margin-top:16px;text-align:center}.info-value{font-size:32px;font-weight:bold;color:#22C55E}</style></head><body><div id="canvas-container"></div><nav class="navbar"><div class="navbar-title">🥫 认识圆柱体</div><div style="display:flex;gap:12px"><button class="btn-kid" id="toggleControls">控制</button><button class="btn-kid" onclick="window.location.href='index.html'">返回</button></div></nav><div class="control-panel" id="controlPanel"><div class="control-section"><label class="control-label" for="radiusSlider">底面半径</label><input type="range" class="kid-slider" id="radiusSlider" min="1" max="5" value="2"><div class="info-display"><div class="info-value" id="radiusValue">2</div></div></div><div class="control-section"><label class="control-label" for="heightSlider">高度</label><input type="range" class="kid-slider" id="heightSlider" min="1" max="10" value="5"><div class="info-display"><div class="info-value" id="heightValue">5</div></div></div><div class="info-display"><div style="font-size:20px">侧面积：<span id="lateralArea" style="color:#22C55E;font-weight:bold">62.8</span></div><div style="margin-top:12px;font-size:20px">体积：<span id="volume" style="color:#06B6D4;font-weight:bold">62.8</span></div></div></div><script>let scene,camera,renderer,cylinder;let radius=2,height=5;function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);camera.position.set(6,4,8);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.getElementById('canvas-container').appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,0.6));const light=new THREE.DirectionalLight(0xffffff,0.8);light.position.set(10,10,10);scene.add(light);createCylinder();updateCalculations();animate()}function createCylinder(){if(cylinder)scene.remove(cylinder);cylinder=new THREE.Group();const geometry=new THREE.CylinderGeometry(radius,radius,height,32);const materials=[new THREE.MeshPhongMaterial({color:0x22C55E,transparent:true,opacity:0.8}),new THREE.MeshPhongMaterial({color:0x06B6D4,transparent:true,opacity:0.8}),new THREE.MeshPhongMaterial({color:0x22C55E,transparent:true,opacity:0.8})];const mesh=new THREE.Mesh(geometry,materials);const edges=new THREE.EdgesGeometry(geometry);const line=new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:0xffffff}));cylinder.add(mesh);cylinder.add(line);const topCircle=new THREE.Mesh(new THREE.RingGeometry(0,radius,32),new THREE.MeshBasicMaterial({color:0x22C55E,side:THREE.DoubleSide}));topCircle.position.y=height/2;topCircle.rotation.x=-Math.PI/2;cylinder.add(topCircle);scene.add(cylinder)}function updateCalculations(){const lateralArea=2*Math.PI*radius*height;const volume=Math.PI*radius*radius*height;document.getElementById('lateralArea').textContent=lateralArea.toFixed(1);document.getElementById('volume').textContent=volume.toFixed(1);document.getElementById('radiusValue').textContent=radius;document.getElementById('heightValue').textContent=height}function animate(){requestAnimationFrame(animate);if(cylinder)cylinder.rotation.y+=0.005;renderer.render(scene,camera)}document.addEventListener('DOMContentLoaded',function(){init();document.getElementById('toggleControls').addEventListener('click',function(){document.getElementById('controlPanel').classList.toggle('active')});document.getElementById('radiusSlider').addEventListener('input',function(){radius=parseFloat(this.value);createCylinder();updateCalculations()});document.getElementById('heightSlider').addEventListener('input',function(){height=parseFloat(this.value);createCylinder();updateCalculations()});});</script></body></html>
