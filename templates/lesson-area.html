<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>面积计算 - AetherViz 小学教学</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script><script src="../modules/accessibility.js"></script><style>:root{--primary-gradient:linear-gradient(135deg,#F59E0B 0%,#EF4444 100%);--bg-gradient:linear-gradient(180deg,#0F172A 0%,#9A3412 50%,#991B1B 100%)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg-gradient);color:#F8FAFC;font-size:18px}#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}#static-container{position:fixed;top:70px;left:0;width:100%;height:calc(100vh-70px);display:none;justify-content:center;align-items:center;z-index:1;background:var(--bg-gradient)}#static-container.active{display:flex}.static-diagram{max-width:90%;max-height:90%;background:rgba(255,255,255,0.05);border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}.navbar{position:fixed;top:0;left:0;right:0;height:70px;background:rgba(15,23,42,0.85);backdrop-filter:blur(10px);border-bottom:2px solid rgba(245,158,11,0.3);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}.navbar-title{font-size:32px;font-weight:bold;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.btn-kid{min-width:60px;min-height:60px;padding:16px 24px;font-size:18px;border-radius:12px;border:none;background:var(--primary-gradient);color:white;cursor:pointer;transition:all 0.3s ease}.btn-kid:hover{transform:scale(1.05)}.control-panel{position:fixed;right:0;top:70px;width:30%;height:calc(100vh-70px);background:rgba(154,52,18,0.7);backdrop-filter:blur(10px);border-left:1px solid rgba(245,158,11,0.25);padding:24px;overflow-y:auto;z-index:90}.control-section{margin-bottom:24px;padding:16px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px}.control-label{font-size:20px;font-weight:600;margin-bottom:12px;display:block}input[type="range"].kid-slider{-webkit-appearance:none;width:100%;height:12px;border-radius:6px;background:rgba(255,255,255,0.2);cursor:pointer}input[type="range"].kid-slider::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--primary-gradient);cursor:pointer}.area-display{text-align:center;padding:24px;background:rgba(245,158,11,0.2);border:2px solid rgba(245,158,11,0.4);border-radius:16px;margin-top:16px}.area-value{font-size:48px;font-weight:bold;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.area-formula{font-size:24px;margin-top:8px;color:#F59E0B}@media(max-width:640px){.navbar{padding:0 12px;height:56px}.navbar-title{font-size:20px}.btn-kid{min-width:44px;min-height:44px;padding:10px 12px;font-size:14px}.control-panel{width:100%;height:50vh;top:56px}}</style></head><body><div id="canvas-container"></div><div id="static-container"><div class="static-diagram"><svg width="700" height="700" viewBox="0 0 700 700"><text x="350" y="40" text-anchor="middle" fill="#F8FAFC" font-size="32" font-weight="bold">面积的计算</text><g transform="translate(50,70)"><rect x="0" y="0" width="280" height="260" fill="rgba(255,255,255,0.05)" rx="15"/><text x="140" y="30" text-anchor="middle" fill="#F59E0B" font-size="24" font-weight="bold">🟧 正方形面积</text><rect x="40" y="50" width="200" height="180" fill="none" stroke="#F59E0B" stroke-width="3"/><g id="square-grid"><line x1="40" y1="90" x2="240" y2="90" stroke="rgba(245,158,11,0.3)" stroke-width="1"/><line x1="40" y1="130" x2="240" y2="130" stroke="rgba(245,158,11,0.3)" stroke-width="1"/><line x1="40" y1="170" x2="240" y2="170" stroke="rgba(245,158,11,0.3)" stroke-width="1"/><line x1="40" y1="210" x2="240" y2="210" stroke="rgba(245,158,11,0.3)" stroke-width="1"/><line x1="90" y1="50" x2="90" y2="230" stroke="rgba(245,158,11,0.3)" stroke-width="1"/><line x1="140" y1="50" x2="140" y2="230" stroke="rgba(245,158,11,0.3)" stroke-width="1"/><line x1="190" y1="50" x2="190" y2="230" stroke="rgba(245,158,11,0.3)" stroke-width="1"/></g><text x="140" y="120" text-anchor="middle" fill="#F8FAFC" font-size="72" opacity="0.1">5×4</text><text x="140" y="250" text-anchor="middle" fill="#F59E0B" font-size="20">边长 × 边长 = 面积</text></g><g transform="translate(370,70)"><rect x="0" y="0" width="280" height="260" fill="rgba(255,255,255,0.05)" rx="15"/><text x="140" y="30" text-anchor="middle" fill="#EF4444" font-size="24" font-weight="bold">📊 长方形面积</text><rect x="40" y="50" width="200" height="140" fill="none" stroke="#EF4444" stroke-width="3"/><g id="rectangle-grid"><line x1="40" y1="90" x2="240" y2="90" stroke="rgba(239,68,68,0.3)" stroke-width="1"/><line x1="40" y1="130" x2="240" y2="130" stroke="rgba(239,68,68,0.3)" stroke-width="1"/><line x1="40" y1="170" x2="240" y2="170" stroke="rgba(239,68,68,0.3)" stroke-width="1"/><line x1="90" y1="50" x2="90" y2="190" stroke="rgba(239,68,68,0.3)" stroke-width="1"/><line x1="140" y1="50" x2="140" y2="190" stroke="rgba(239,68,68,0.3)" stroke-width="1"/><line x1="190" y1="50" x2="190" y2="190" stroke="rgba(239,68,68,0.3)" stroke-width="1"/></g><text x="140" y="220" text-anchor="middle" fill="#EF4444" font-size="20">长 × 宽 = 面积</text></g><g transform="translate(50,350)"><rect x="0" y="0" width="600" height="300" fill="rgba(255,255,255,0.05)" rx="15"/><text x="300" y="30" text-anchor="middle" fill="#22C55E" font-size="24" font-weight="bold">📐 面积单位换算</text><text x="100" y="80" text-anchor="middle" fill="#F8FAFC" font-size="20">1平方米 = 100平方分米</text><text x="100" y="120" text-anchor="middle" fill="#F8FAFC" font-size="20">1平方分米 = 100平方厘米</text><text x="100" y="160" text-anchor="middle" fill="#F8FAFC" font-size="20">1平方厘米 = 100平方毫米</text><rect x="250" y="60" width="300" height="200" fill="none" stroke="#22C55E" stroke-width="2"/><text x="400" y="100" text-anchor="middle" fill="#22C55E" font-size="18">面积单位</text><text x="400" y="140" text-anchor="middle" fill="#F8FAFC" font-size="16">平方米 (m²)</text><text x="400" y="170" text-anchor="middle" fill="#F8FAFC" font-size="16">平方分米 (dm²)</text><text x="400" y="200" text-anchor="middle" fill="#F8FAFC" font-size="16">平方厘米 (cm²)</text><text x="400" y="230" text-anchor="middle" fill="#F8FAFC" font-size="16">平方毫米 (mm²)</text></g></svg></div></div><nav class="navbar"><div class="navbar-title">📊 面积计算</div><div style="display:flex;gap:12px"><button class="btn-kid" id="toggleControls">控制</button><button class="btn-kid" id="toggleStatic">静态展示</button><button class="btn-kid" onclick="window.location.href='index.html'">返回</button></div></nav><div class="control-panel" id="controlPanel"><div class="control-section"><label class="control-label" for="shapeSelect">📐 选择形状</label><div style="display:flex;gap:8px"><button class="btn-kid" id="btnSquare">正方形</button><button class="btn-kid" id="btnRectangle">长方形</button></div></div><div class="control-section"><label class="control-label" for="widthSlider">宽度/边长</label><input type="range" class="kid-slider" id="widthSlider" min="1" max="10" value="5"><div style="text-align:center;margin-top:8px;font-size:24px;font-weight:bold" id="widthValue">5</div></div><div class="control-section"><label class="control-label" for="heightSlider">高度</label><input type="range" class="kid-slider" id="heightSlider" min="1" max="10" value="4"><div style="text-align:center;margin-top:8px;font-size:24px;font-weight:bold" id="heightValue">4</div></div><div class="control-section"><label class="control-label">📏 显示网格</label><div style="display:flex;gap:8px"><button class="btn-kid" id="btnGridOn">显示</button><button class="btn-kid" id="btnGridOff">隐藏</button></div></div><div class="area-display"><div class="area-value" id="areaValue">20</div><div class="area-formula" id="areaFormula">5 × 4 = 20 平方单位</div></div></div><script>let scene,camera,renderer,currentShape,showGrid=true;let width=5,height=4,shapeType='rectangle';function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);camera.position.set(0,5,12);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.getElementById('canvas-container').appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,0.6));const light=new THREE.DirectionalLight(0xffffff,0.8);light.position.set(10,10,10);scene.add(light);createShape();updateArea();animate()}function createShape(){if(currentShape)scene.remove(currentShape);currentShape=new THREE.Group();const geometry=new THREE.BoxGeometry(shapeType==='square'?width:width,height,0.2,shapeType==='square'?width:10,height,1);const material=new THREE.MeshPhongMaterial({color:shapeType==='square'?0xF59E0B:0xEF4444,transparent:true,opacity:0.8});const mesh=new THREE.Mesh(geometry,material);currentShape.add(mesh);if(showGrid){const edges=new THREE.EdgesGeometry(geometry);const line=new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:0xffffff,opacity:0.3,transparent:true}));currentShape.add(line);}scene.add(currentShape)}function updateArea(){const area=shapeType==='square'?width*width:width*height;document.getElementById('areaValue').textContent=area;document.getElementById('areaFormula').textContent=shapeType==='square'?width+' × '+width+' = '+area+' 平方单位':width+' × '+height+' = '+area+' 平方单位';document.getElementById('widthValue').textContent=width;document.getElementById('heightValue').textContent=height}function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}document.addEventListener('DOMContentLoaded',function(){init();document.getElementById('toggleControls').addEventListener('click',function(){document.getElementById('controlPanel').classList.toggle('active')});document.getElementById('toggleStatic').addEventListener('click',function(){document.getElementById('static-container').classList.toggle('active')});document.getElementById('btnSquare').addEventListener('click',function(){shapeType='square';document.getElementById('heightSlider').disabled=true;createShape();updateArea()});document.getElementById('btnRectangle').addEventListener('click',function(){shapeType='rectangle';document.getElementById('heightSlider').disabled=false;createShape();updateArea()});document.getElementById('widthSlider').addEventListener('input',function(){width=parseInt(this.value);createShape();updateArea()});document.getElementById('heightSlider').addEventListener('input',function(){height=parseInt(this.value);createShape();updateArea()});document.getElementById('btnGridOn').addEventListener('click',function(){showGrid=true;createShape()});document.getElementById('btnGridOff').addEventListener('click',function(){showGrid=false;createShape()});if(window.A11y)window.A11y.addAriaLabels()});</script></body></html>
