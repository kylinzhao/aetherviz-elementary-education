<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>水循环 - AetherViz 小学教学</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script><style>:root{--primary-gradient:linear-gradient(135deg,#3B82F6 0%,#22C55E 100%);--bg-gradient:linear-gradient(180deg,#0F172A 0%,#1E3A8A 50%,#14532D 100%)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg-gradient);color:#F8FAFC;font-size:18px}#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}.navbar{position:fixed;top:0;left:0;right:0;height:70px;background:rgba(15,23,42,0.85);backdrop-filter:blur(10px);border-bottom:2px solid rgba(59,130,246,0.3);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}.navbar-title{font-size:32px;font-weight:bold;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.btn-kid{min-width:60px;min-height:60px;padding:16px 24px;font-size:18px;border-radius:12px;border:none;background:var(--primary-gradient);color:white;cursor:pointer}.control-panel{position:fixed;right:0;top:70px;width:30%;height:calc(100vh-70px);background:rgba(30,58,138,0.7);backdrop-filter:blur(10px);border-left:1px solid rgba(59,130,246,0.25);padding:24px;overflow-y:auto;z-index:90}.control-section{margin-bottom:24px;padding:16px;background:rgba(255,255,255,0.08);border-radius:12px}.control-label{font-size:20px;font-weight:600;margin-bottom:12px;display:block}.process-step{padding:12px;background:rgba(59,130,246,0.2);border-left:4px solid #3B82F6;margin-bottom:8px}.process-step.active{background:rgba(34,197,94,0.2);border-left-color:#22C55E}</style></head><body><div id="canvas-container"></div><nav class="navbar"><div class="navbar-title">💧 水循环</div><div style="display:flex;gap:12px"><button class="btn-kid" id="toggleControls">控制</button><button class="btn-kid" onclick="window.location.href='index.html'">返回</button></div></nav><div class="control-panel" id="controlPanel"><div class="control-section"><label class="control-label">🌊 水循环过程</label><div class="process-step" id="step1">1️⃣ 蒸发：水变成水蒸气</div><div class="process-step" id="step2">2️⃣ 凝结：水蒸气形成云</div><div class="process-step" id="step3">3️⃣ 降水：云变成雨雪</div><div class="process-step" id="step4">4️⃣ 径流：水流回海洋</div></div><div class="control-section"><label class="control-label">🎬 播放动画</label><button class="btn-kid" id="btnPlay">播放完整水循环</button></div></div><script>let scene,camera,renderer,particles=[];function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);camera.position.set(0,5,20);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.getElementById('canvas-container').appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,0.6));const light=new THREE.DirectionalLight(0xffffff,0.8);light.position.set(10,10,10);scene.add(light);createEnvironment();animate()}function createEnvironment(){const oceanMat=new THREE.MeshPhongMaterial({color:0x1E40AF,transparent:true,opacity:0.8});const ocean=new THREE.Mesh(new THREE.BoxGeometry(30,2,20),oceanMat);ocean.position.y=-4;scene.add(ocean);const sunMat=new THREE.MeshBasicMaterial({color:0xFBBF24});const sun=new THREE.Mesh(new THREE.SphereGeometry(3,32,32),sunMat);sun.position.set(12,8,-10);scene.add(sun);const landMat=new THREE.MeshPhongMaterial({color:0x22C55E});const land=new THREE.Mesh(new THREE.ConeGeometry(5,8,4),landMat);land.position.set(-10,-2,5);land.rotation.x=-0.2;scene.add(land)}function createParticles(type){const count=50;const geom=new THREE.SphereGeometry(0.1,8,8);const mat=new THREE.MeshBasicMaterial({color:0x60A5FA});for(let i=0;i<count;i++){const particle=new THREE.Mesh(geom,mat);particle.userData={type,speed:Math.random()*0.1+0.05,phase:Math.random()*Math.PI*2};if(type==='evaporation'){particle.position.set(Math.random()*20-10,-3,Math.random()*10-5)}else if(type==='precipitation'){particle.position.set(Math.random()*20-10,10,Math.random()*10-5)}particles.push(particle);scene.add(particle)}}function animateParticles(){particles.forEach(p=>{if(p.userData.type==='evaporation'){p.position.y+=p.userData.speed;p.userData.phase+=0.02;p.position.x+=Math.sin(p.userData.phase)*0.02;if(p.position.y>8)p.position.y=-3}else if(p.userData.type==='precipitation'){p.position.y-=p.userData.speed;if(p.position.y<-3)p.position.y=10}})}let animationStep=0;function playAnimation(){const steps=['step1','step2','step3','step4'];steps.forEach(s=>document.getElementById(s).classList.remove('active'));if(animationStep<4){document.getElementById(steps[animationStep]).classList.add('active');if(animationStep===0){createParticles('evaporation')}else if(animationStep===2){createParticles('precipitation')}animationStep++;setTimeout(playAnimation,2000)}else{animationStep=0}}function animate(){requestAnimationFrame(animate);animateParticles();renderer.render(scene,camera)}document.addEventListener('DOMContentLoaded',function(){init();document.getElementById('toggleControls').addEventListener('click',function(){document.getElementById('controlPanel').classList.toggle('active')});document.getElementById('btnPlay').addEventListener('click',playAnimation)});</script></body></html>
