<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>声音的传播 - AetherViz 小学教学</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script><style>:root{--primary-gradient:linear-gradient(135deg,#06B6D4 0%,#8B5CF6 100%);--bg-gradient:linear-gradient(180deg,#0F172A 0%,#155E75 50%,#5B21B6 100%)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg-gradient);color:#F8FAFC;font-size:18px}#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}.navbar{position:fixed;top:0;left:0;right:0;height:70px;background:rgba(15,23,42,0.85);backdrop-filter:blur(10px);border-bottom:2px solid rgba(6,182,212,0.3);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}.navbar-title{font-size:32px;font-weight:bold;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.btn-kid{min-width:60px;min-height:60px;padding:16px 24px;font-size:18px;border-radius:12px;border:none;background:var(--primary-gradient);color:white;cursor:pointer}.control-panel{position:fixed;right:0;top:70px;width:30%;height:calc(100vh-70px);background:rgba(21,94,117,0.7);backdrop-filter:blur(10px);border-left:1px solid rgba(6,182,212,0.25);padding:24px;overflow-y:auto;z-index:90}.control-section{margin-bottom:24px;padding:16px;background:rgba(255,255,255,0.08);border-radius:12px}.control-label{font-size:20px;font-weight:600;margin-bottom:12px;display:block}input[type="range"].kid-slider{-webkit-appearance:none;width:100%;height:12px;border-radius:6px;background:rgba(255,255,255,0.2);cursor:pointer}input[type="range"].kid-slider::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--primary-gradient);cursor:pointer}</style></head><body><div id="canvas-container"></div><nav class="navbar"><div class="navbar-title">🔊 声音的传播</div><div style="display:flex;gap:12px"><button class="btn-kid" id="toggleControls">控制</button><button class="btn-kid" onclick="window.location.href='index.html'">返回</button></div></nav><div class="control-panel" id="controlPanel"><div class="control-section"><label class="control-label">🎵 演示声音产生</label><button class="btn-kid" id="btnVibrate">让音叉振动</button></div><div class="control-section"><label class="control-label">🌊 声波传播</label><button class="btn-kid" id="btnWave">显示声波</button></div><div class="control-section"><label class="control-label" for="freqSlider">音调（频率）</label><input type="range" class="kid-slider" id="freqSlider" min="1" max="10" value="5"><div style="text-align:center;margin-top:8px;font-size:24px" id="freqValue">中等音调</div></div><div class="control-section"><label class="control-label" for="ampSlider">响度（振幅）</label><input type="range" class="kid-slider" id="ampSlider" min="1" max="10" value="5"><div style="text-align:center;margin-top:8px;font-size:24px" id="ampValue">中等响度</div></div></div><script>let scene,camera,renderer,tuningFork,waves=[];let isVibrating=false;function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);camera.position.set(0,2,10);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.getElementById('canvas-container').appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,0.6));const light=new THREE.DirectionalLight(0xffffff,0.8);light.position.set(10,10,10);scene.add(light);createTuningFork();animate()}function createTuningFork(){tuningFork=new THREE.Group();const handleMat=new THREE.MeshPhongMaterial({color:0x9CA3AF});const handle=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,3,16),handleMat);handle.position.y=1.5;tuningFork.add(handle);const prongMat=new THREE.MeshPhongMaterial({color:0x06B6D4});const prong1=new THREE.Mesh(new THREE.BoxGeometry(0.15,3,0.15),prongMat);prong1.position.set(-0.3,3,0);tuningFork.add(prong1);const prong2=new THREE.Mesh(new THREE.BoxGeometry(0.15,3,0.15),prongMat);prong2.position.set(0.3,3,0);tuningFork.add(prong2);const baseMat=new THREE.MeshPhongMaterial({color:0xF59E0B});const base=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.6,0.3,16),baseMat);base.position.y=0.15;tuningFork.add(base);scene.add(tuningFork)}function createWaves(){for(let i=0;i<5;i++){const waveGeom=new THREE.RingGeometry(1+i*0.8,1.2+i*0.8,32,1,0,Math.PI*2);const waveMat=new THREE.MeshBasicMaterial({color:0x8B5CF6,side:THREE.DoubleSide,transparent:true,opacity:0.6});const wave=new THREE.Mesh(waveGeom,waveMat);wave.position.set(3,3,-5);wave.visible=false;waves.push(wave);scene.add(wave)}}let waveTime=0;function animate(){requestAnimationFrame(animate);if(isVibrating){tuningFork.rotation.z=Math.sin(Date.now()*0.05)*0.05;waveTime+=0.02;waves.forEach((wave,i)=>{if(wave.visible){wave.material.opacity=0.6-(waveTime%1)*0.6;const scale=1+(waveTime%1)*0.5;wave.scale.set(scale,scale,1)}})}renderer.render(scene,camera)}document.addEventListener('DOMContentLoaded',function(){init();createWaves();document.getElementById('toggleControls').addEventListener('click',function(){document.getElementById('controlPanel').classList.toggle('active')});document.getElementById('btnVibrate').addEventListener('click',function(){isVibrating=!isVibrating;if(isVibrating){let delay=0;waves.forEach(wave=>{setTimeout(()=>{wave.visible=true},delay);delay+=500})}else{waves.forEach(wave=>wave.visible=false)}})});</script></body></html>
