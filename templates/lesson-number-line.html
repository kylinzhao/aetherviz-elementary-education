<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>数线与数轴 - AetherViz 小学教学</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script><style>:root{--primary-gradient:linear-gradient(135deg,#8B5CF6 0%,#EC4899 100%);--bg-gradient:linear-gradient(180deg,#0F172A 0%,#5B21B6 50%,#9F1239 100%)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg-gradient);color:#F8FAFC;font-size:18px}#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}.navbar{position:fixed;top:0;left:0;right:0;height:70px;background:rgba(15,23,42,0.85);backdrop-filter:blur(10px);border-bottom:2px solid rgba(139,92,246,0.3);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}.navbar-title{font-size:32px;font-weight:bold;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.btn-kid{min-width:60px;min-height:60px;padding:16px 24px;font-size:18px;border-radius:12px;border:none;background:var(--primary-gradient);color:white;cursor:pointer}.control-panel{position:fixed;right:0;top:70px;width:30%;height:calc(100vh-70px);background:rgba(91,33,182,0.7);backdrop-filter:blur(10px);border-left:1px solid rgba(139,92,246,0.25);padding:24px;overflow-y:auto;z-index:90}.control-section{margin-bottom:24px;padding:16px;background:rgba(255,255,255,0.08);border-radius:12px}.control-label{font-size:20px;font-weight:600;margin-bottom:12px;display:block}</style></head><body><div id="canvas-container"></div><nav class="navbar"><div class="navbar-title">📚 数线与数轴</div><div style="display:flex;gap:12px"><button class="btn-kid" id="toggleControls">控制</button><button class="btn-kid" onclick="window.location.href='index.html'">返回</button></div></nav><div class="control-panel" id="controlPanel"><div class="control-section"><p style="font-size:18px;line-height:1.6;color:#CBD5E1">这是一个教学演示页面。3D场景和交互功能正在开发中...</p><p style="margin-top:16px;font-size:16px;color:#94A3B8">该页面将在后续更新中完善，包括：</p><ul style="margin-top:12px;margin-left:20px;color:#94A3B8"><li>完整的3D可视化场景</li><li>交互式参数调节</li><li>实时计算和反馈</li><li>静态教学图</li></ul></div></div><script>let scene,camera,renderer;function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);camera.position.set(0,0,10);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.getElementById('canvas-container').appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,0.6));const light=new THREE.DirectionalLight(0xffffff,0.8);light.position.set(10,10,10);scene.add(light);const geometry=new THREE.BoxGeometry(2,2,2);const material=new THREE.MeshPhongMaterial({color:0x8B5CF6});const cube=new THREE.Mesh(geometry,material);scene.add(cube);animate()}function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}document.addEventListener('DOMContentLoaded',function(){init();document.getElementById('toggleControls').addEventListener('click',function(){document.getElementById('controlPanel').classList.toggle('active')})});</script></body></html>
