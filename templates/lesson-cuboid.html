<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>认识长方体 - AetherViz 小学教学</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script><script src="../modules/accessibility.js"></script><style>:root{--primary-gradient:linear-gradient(135deg,#8B5CF6 0%,#EC4899 100%);--bg-gradient:linear-gradient(180deg,#0F172A 0%,#5B21B6 50%,#9F1239 100%)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg-gradient);color:#F8FAFC;font-size:18px}#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}#static-container{position:fixed;top:70px;left:0;width:100%;height:calc(100vh-70px);display:none;justify-content:center;align-items:center;z-index:1;background:var(--bg-gradient)}#static-container.active{display:flex}.static-diagram{max-width:90%;max-height:90%;background:rgba(255,255,255,0.05);border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}.navbar{position:fixed;top:0;left:0;right:0;height:70px;background:rgba(15,23,42,0.85);backdrop-filter:blur(10px);border-bottom:2px solid rgba(139,92,246,0.3);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:100}.navbar-title{font-size:32px;font-weight:bold;background:var(--primary-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.btn-kid{min-width:60px;min-height:60px;padding:16px 24px;font-size:18px;border-radius:12px;border:none;background:var(--primary-gradient);color:white;cursor:pointer;transition:all 0.3s ease}.btn-kid:hover{transform:scale(1.05)}.control-panel{position:fixed;right:0;top:70px;width:30%;height:calc(100vh-70px);background:rgba(91,33,182,0.7);backdrop-filter:blur(10px);border-left:1px solid rgba(139,92,246,0.25);padding:24px;overflow-y:auto;z-index:90}.control-section{margin-bottom:24px;padding:16px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px}.control-label{font-size:20px;font-weight:600;margin-bottom:12px;display:block}input[type="range"].kid-slider{-webkit-appearance:none;width:100%;height:12px;border-radius:6px;background:rgba(255,255,255,0.2);cursor:pointer}input[type="range"].kid-slider::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--primary-gradient);cursor:pointer}.info-display{text-align:center;padding:16px;background:rgba(139,92,246,0.2);border:2px solid rgba(139,92,246,0.4);border-radius:12px;margin-top:16px}.info-value{font-size:32px;font-weight:bold;color:#8B5CF6}@media(max-width:640px){.navbar{padding:0 12px;height:56px}.navbar-title{font-size:20px}.btn-kid{min-width:44px;min-height:44px;padding:10px 12px;font-size:14px}.control-panel{width:100%;height:50vh;top:56px}}</style></head><body><div id="canvas-container"></div><div id="static-container"><div class="static-diagram"><svg width="800" height="850" viewBox="0 0 800 850"><text x="400" y="40" text-anchor="middle" fill="#F8FAFC" font-size="32" font-weight="bold">认识长方体</text><g transform="translate(50,70)"><rect x="0" y="0" width="700" height="350" fill="rgba(255,255,255,0.05)" rx="15"/><text x="350" y="30" text-anchor="middle" fill="#8B5CF6" font-size="24" font-weight="bold">📦 长方体的展开图</text><g transform="translate(50,60)"><rect x="0" y="80" width="120" height="80" fill="none" stroke="#EC4899" stroke-width="2" id="unfold-front"/><text x="60" y="125" text-anchor="middle" fill="#F8FAFC" font-size="16">前面</text><rect x="120" y="80" width="120" height="80" fill="none" stroke="#8B5CF6" stroke-width="2"/><text x="180" y="125" text-anchor="middle" fill="#F8FAFC" font-size="16">上面</text><rect x="240" y="80" width="120" height="80" fill="none" stroke="#8B5CF6" stroke-width="2"/><text x="300" y="125" text-anchor="middle" fill="#F8FAFC" font-size="16">后面</text><rect x="120" y="0" width="120" height="80" fill="none" stroke="#22C55E" stroke-width="2"/><text x="180" y="45" text-anchor="middle" fill="#F8FAFC" font-size="16">底面</text><rect x="0" y="160" width="120" height="80" fill="none" stroke="#F59E0B" stroke-width="2"/><text x="60" y="205" text-anchor="middle" fill="#F8FAFC" font-size="16">左面</text><rect x="120" y="160" width="120" height="80" fill="none" stroke="#06B6D4" stroke-width="2"/><text x="180" y="205" text-anchor="middle" fill="#F8FAFC" font-size="16">右面</text></g></g><g transform="translate(50,440)"><rect x="0" y="0" width="700" height="350" fill="rgba(255,255,255,0.05)" rx="15"/><text x="350" y="30" text-anchor="middle" fill="#8B5CF6" font-size="24" font-weight="bold">📐 长方体的组成</text><g transform="translate(200,80)"><rect x="0" y="0" width="300" height="200" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-dasharray="5,5"/><rect x="50" y="30" width="200" height="140" fill="rgba(139,92,246,0.3)" stroke="#8B5CF6" stroke-width="3"/><circle cx="50" cy="30" r="8" fill="#FBBF24"/><circle cx="250" cy="30" r="8" fill="#FBBF24"/><circle cx="50" cy="170" r="8" fill="#FBBF24"/><circle cx="250" cy="170" r="8" fill="#FBBF24"/><circle cx="50" cy="30" r="8" fill="#F59E0B"/><circle cx="250" cy="30" r="8" fill="#F59E0B"/><circle cx="50" cy="170" r="8" fill="#F59E0B"/><circle cx="250" cy="170" r="8" fill="#F59E0B"/><text x="150" y="240" text-anchor="middle" fill="#FBBF24" font-size="20">顶点（8个）</text><line x1="50" y1="30" x2="250" y2="30" stroke="#22C55E" stroke-width="2"/><text x="150" y="20" text-anchor="middle" fill="#22C55E" font-size="16">棱（12条）</text><rect x="80" y="50" width="140" height="100" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="5,5"/><text x="300" y="100" fill="#EC4899" font-size="16">面（6个）</text></g></g></svg></div></div><nav class="navbar"><div class="navbar-title">📦 认识长方体</div><div style="display:flex;gap:12px"><button class="btn-kid" id="toggleControls">控制</button><button class="btn-kid" id="toggleStatic">静态展示</button><button class="btn-kid" id="btnUnfold">展开</button><button class="btn-kid" onclick="window.location.href='index.html'">返回</button></div></nav><div class="control-panel" id="controlPanel"><div class="control-section"><label class="control-label" for="lengthSlider">长度</label><input type="range" class="kid-slider" id="lengthSlider" min="1" max="10" value="4"><div class="info-display"><div class="info-value" id="lengthValue">4</div></div></div><div class="control-section"><label class="control-label" for="widthSlider">宽度</label><input type="range" class="kid-slider" id="widthSlider" min="1" max="10" value="3"><div class="info-display"><div class="info-value" id="widthValue">3</div></div></div><div class="control-section"><label class="control-label" for="heightSlider">高度</label><input type="range" class="kid-slider" id="heightSlider" min="1" max="10" value="2"><div class="info-display"><div class="info-value" id="heightValue">2</div></div></div><div class="info-display"><div style="font-size:20px;font-weight:bold;color:#8B5CF6">计算结果</div><div style="margin-top:8px">表面积：<span id="surfaceArea" style="color:#EC4899;font-size:24px;font-weight:bold">52</span></div><div style="margin-top:8px">体积：<span id="volume" style="color:#22C55E;font-size:24px;font-weight:bold">24</span></div></div></div><script>let scene,camera,renderer,cuboid;let length=4,width=3,height=2,isUnfolded=false;function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,1000);camera.position.set(8,6,10);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.getElementById('canvas-container').appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,0.6));const light=new THREE.DirectionalLight(0xffffff,0.8);light.position.set(10,10,10);scene.add(light);createCuboid();updateCalculations();animate()}function createCuboid(){if(cuboid)scene.remove(cuboid);cuboid=new THREE.Group();const colors=[0x8B5CF6,0xEC4899,0x22C55E,0xF59E0B,0x06B6D4,0xEF4444];const faceColors=[colors[0],colors[0],colors[1],colors[1],colors[2],colors[2]];const materials=faceColors.map(c=>new THREE.MeshPhongMaterial({color:c,transparent:true,opacity:0.8}));const geometry=new THREE.BoxGeometry(length,width,height);const mesh=new THREE.Mesh(geometry,materials);const edges=new THREE.EdgesGeometry(geometry);const line=new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:0xffffff,linewidth:2}));cuboid.add(mesh);cuboid.add(line);const vertices=[[-length/2,-width/2,height/2],[length/2,-width/2,height/2],[length/2,width/2,height/2],[-length/2,width/2,height/2],[-length/2,-width/2,-height/2],[length/2,-width/2,-height/2],[length/2,width/2,-height/2],[-length/2,width/2,-height/2]];vertices.forEach(v=>{const dotGeom=new THREE.SphereGeometry(0.15,16,16);const dotMat=new THREE.MeshBasicMaterial({color:0xFBBF24});const dot=new THREE.Mesh(dotGeom,dotMat);dot.position.set(v[0],v[1],v[2]);cuboid.add(dot)});scene.add(cuboid)}function updateCalculations(){const surfaceArea=2*(length*width+length*height+width*height);const volume=length*width*height;document.getElementById('surfaceArea').textContent=surfaceArea;document.getElementById('volume').textContent=volume;document.getElementById('lengthValue').textContent=length;document.getElementById('widthValue').textContent=width;document.getElementById('heightValue').textContent=height}function animate(){requestAnimationFrame(animate);if(cuboid&&!isUnfolded)cuboid.rotation.y+=0.005;renderer.render(scene,camera)}document.addEventListener('DOMContentLoaded',function(){init();document.getElementById('toggleControls').addEventListener('click',function(){document.getElementById('controlPanel').classList.toggle('active')});document.getElementById('toggleStatic').addEventListener('click',function(){document.getElementById('static-container').classList.toggle('active')});document.getElementById('lengthSlider').addEventListener('input',function(){length=parseInt(this.value);createCuboid();updateCalculations()});document.getElementById('widthSlider').addEventListener('input',function(){width=parseInt(this.value);createCuboid();updateCalculations()});document.getElementById('heightSlider').addEventListener('input',function(){height=parseInt(this.value);createCuboid();updateCalculations()});document.getElementById('btnUnfold').addEventListener('click',function(){isUnfolded=!isUnfolded;if(isUnfolded){if(cuboid)scene.remove(cuboid);alert('展开动画功能开发中...请查看静态展示')}else{createCuboid()}});if(window.A11y)window.A11y.addAriaLabels()});</script></body></html>
